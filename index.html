<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض أبو زياد للملابس</title>
<meta name="theme-color" content="#1B4B4A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F1;
    --bg-soft: #EFEBE3;
    --card: #FFFFFF;
    --border: #E8E2D6;
    --ink: #2D2A26;
    --ink-soft: #6B655C;
    --tan: #8B7355;
    --tan-dark: #6E5A42;
    --sage: #5B7065;
    --sage-soft: #E7EDE9;
    --rust: #B85C4A;
    --rust-soft: #F5E7E3;
    --gold: #B8944A;
    --gold-soft: #F3ECDC;
    --shadow: 0 1px 2px rgba(45,42,38,0.04), 0 2px 8px rgba(45,42,38,0.04);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  h1, h2, h3, .brand {
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  /* ===== HEADER ===== */
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand-block { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 42px; height: 42px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
  .brand-text .name {
    font-family: 'Tajawal', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--ink);
    line-height: 1.1;
  }
  .brand-text .sub {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .date-chip {
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--bg-soft);
    padding: 8px 14px;
    border-radius: 8px;
  }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--sage);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  /* ===== NAV ===== */
  .nav {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 4px;
    padding: 0 24px;
    overflow-x: auto;
  }
  .nav-item {
    padding: 14px 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: color .15s ease, border-color .15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-item:hover { color: var(--ink); }
  .nav-item.active {
    color: var(--tan-dark);
    border-bottom-color: var(--tan);
  }

  /* ===== LAYOUT ===== */
  .page { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 800;
  }

  .btn {
    font-family: 'Cairo', sans-serif;
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--tan); color: white; }
  .btn-primary:hover { background: var(--tan-dark); }
  .btn-sage { background: var(--sage); color: white; }
  .btn-sage:hover { opacity: .9; }
  .btn-ghost { background: var(--bg-soft); color: var(--ink); }
  .btn-ghost:hover { background: var(--border); }
  .btn-rust { background: var(--rust); color: white; }
  .btn-rust:hover { opacity: .9; }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== STAT CARDS ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .stats-grid { grid-template-columns: 1fr; } }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .stat-card .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .stat-icon {
    width: 36px; height: 36px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .stat-label { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .stat-value { font-size: 24px; font-weight: 800; }

  .icon-tan { background: var(--gold-soft); color: var(--gold); }
  .icon-sage { background: var(--sage-soft); color: var(--sage); }
  .icon-rust { background: var(--rust-soft); color: var(--rust); }
  .icon-neutral { background: var(--bg-soft); color: var(--tan-dark); }

  /* ===== QUICK ACTIONS ===== */
  .quick-actions {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .quick-actions h3 { font-size: 15px; margin-bottom: 14px; color: var(--ink); }
  .qa-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 900px) { .qa-grid { grid-template-columns: repeat(2, 1fr); } }

  .qa-btn {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
  }
  .qa-btn:hover { background: var(--card); border-color: var(--tan); }
  .qa-btn .qa-icon { font-size: 22px; display: block; margin-bottom: 8px; }

  /* ===== TABLE ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: var(--bg-soft);
    padding: 12px 16px;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 14px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-soft); }

  .empty-state {
    padding: 50px 20px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 10px; opacity: .5; }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-sage { background: var(--sage-soft); color: var(--sage); }
  .badge-rust { background: var(--rust-soft); color: var(--rust); }
  .badge-gold { background: var(--gold-soft); color: var(--gold); }

  /* ===== POS SCREEN ===== */
  .pos-layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 950px) {
    .pos-layout { grid-template-columns: 1fr; }
  }

  .pos-summary {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 18px;
  }
  .total-box {
    background: var(--sage);
    color: white;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .total-box .label { font-size: 13px; opacity: .85; margin-bottom: 4px; }
  .total-box .amount { font-size: 30px; font-weight: 800; }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .summary-row:last-of-type { border-bottom: none; }
  .summary-row .lbl { color: var(--ink-soft); }
  .summary-row .val { font-weight: 700; }

  .field-group { margin: 14px 0; }
  .field-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  .field-input, select.field-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
  }
  .field-input:focus { outline: none; border-color: var(--tan); background: white; }

  .pay-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .pay-method {
    padding: 12px 6px;
    text-align: center;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-soft);
    background: var(--bg);
  }
  .pay-method.active { border-color: var(--sage); background: var(--sage-soft); color: var(--sage); }

  .pos-main {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .search-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .search-bar input {
    flex: 1;
    min-width: 200px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
  }
  .search-bar input:focus { outline: none; border-color: var(--tan); }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    padding: 18px 20px;
  }
  .product-tile {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s ease, transform .1s ease;
    background: var(--bg);
  }
  .product-tile:hover { border-color: var(--tan); transform: translateY(-1px); }
  .product-tile .p-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .product-tile .p-price { color: var(--tan-dark); font-weight: 800; font-size: 15px; }
  .product-tile .p-stock { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .product-tile.low-stock .p-stock { color: var(--rust); font-weight: 700; }

  .cart-list { padding: 4px 20px 20px; }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .ci-name { flex: 1; font-weight: 600; font-size: 14px; }
  .cart-item .ci-price { font-size: 13px; color: var(--ink-soft); min-width: 70px; text-align: center; }
  .qty-control { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:hover { background: var(--border); }
  .ci-qty { width: 28px; text-align: center; font-weight: 700; }
  .ci-total { min-width: 75px; text-align: left; font-weight: 800; }
  .ci-remove { color: var(--rust); cursor: pointer; font-size: 16px; padding: 0 4px; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(45,42,38,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: white;
    border-radius: 14px;
    padding: 26px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h3 { margin-bottom: 18px; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 200;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .section-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .loading-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--tan);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  /* ===== LOGIN SCREEN ===== */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1B4B4A 0%, #0F3231 100%);
    padding: 20px;
  }
  .login-box {
    background: white;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-logo {
    width: 90px; height: 90px;
    border-radius: 16px;
    overflow: hidden;
    margin: 0 auto 18px;
  }
  .login-logo img { width: 100%; height: 100%; object-fit: cover; }
  .login-box h2 { font-size: 20px; margin-bottom: 6px; }
  .login-box .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 26px; }
  .login-box .field-input { text-align: center; font-size: 16px; letter-spacing: 2px; }
  .login-error { color: var(--rust); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .login-box .btn { width: 100%; justify-content: center; margin-top: 16px; }
</style>
</head>

<div class="topbar">

<script>
// ===================== STORAGE HELPERS (IndexedDB) =====================
// يعمل محليًا في متصفح الجهاز نفسه، ويفضل محفوظ حتى بعد إغلاق المتصفح.
// ملحوظة: البيانات مرتبطة بالجهاز والمتصفح اللي بتفتح بيهم بالظبط.
const DB_NAME = 'abuZiyadShopDB';
const STORE_NAME = 'shopData';
const DB_KEY = 'shop-data';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function loadData() {
  try {
    const db = await openDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(DB_KEY);
      req.onsuccess = () => {
        if (req.result) {
          const parsed = JSON.parse(req.result);
          if (!parsed.debts) parsed.debts = [];
          if (!parsed.categories) parsed.categories = [...DEFAULT_CATEGORIES];
          if (!parsed.returns) parsed.returns = [];
          if (!parsed.suppliers) parsed.suppliers = [];
          if (!parsed.purchaseInvoices) parsed.purchaseInvoices = [];
          if (!parsed.onlineOrders) parsed.onlineOrders = [];
          resolve(parsed);
        }
        else resolve({ products: [], invoices: [], expenses: [], debts: [], categories: [...DEFAULT_CATEGORIES], returns: [], suppliers: [], purchaseInvoices: [], onlineOrders: [] });
      };
      req.onerror = () => resolve({ products: [], invoices: [], expenses: [], debts: [], categories: [...DEFAULT_CATEGORIES], returns: [], suppliers: [], purchaseInvoices: [], onlineOrders: [] });
    });
  } catch (e) {
    console.error('load failed', e);
    return { products: [], invoices: [], expenses: [], debts: [], categories: [...DEFAULT_CATEGORIES], returns: [], suppliers: [], purchaseInvoices: [], onlineOrders: [] };
  }
}

async function saveData(data) {
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(JSON.stringify(data), DB_KEY);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.error('save failed', e);
    showToast('حصل خطأ في حفظ البيانات، حاول تاني');
  }
}

let STATE = { products: [], invoices: [], expenses: [], debts: [] };
let cart = []; // {productId, name, price, qty}
let currentPage = 'dashboard';
let discountPercent = 0;
let paymentMethod = 'كاش';
let saleType = 'عادي'; // عادي | آجل
let lastPaidNow = '';
const DEFAULT_CATEGORIES = ['عبايات', 'استقبال', 'لانجري', 'عبايات مطرزة', 'إكسسوارات'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function money(n) {
  return (Math.round(n * 100) / 100).toLocaleString('ar-EG', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ج.م';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setDate() {
  const d = new Date();
  document.getElementById('todayDate').textContent = d.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

// ===================== NAV =====================
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentPage = item.dataset.page;
    render();
  });
});

// ===================== RENDER ROUTER =====================
function render() {
  const el = document.getElementById('pageContent');
  if (currentPage === 'dashboard') el.innerHTML = renderDashboard();
  else if (currentPage === 'pos') { el.innerHTML = renderPOS(); attachPOSHandlers(); }
  else if (currentPage === 'products') el.innerHTML = renderProducts();
  else if (currentPage === 'invoices') el.innerHTML = renderInvoices();
  else if (currentPage === 'expenses') el.innerHTML = renderExpenses();
  else if (currentPage === 'profits') el.innerHTML = renderProfits();
  else if (currentPage === 'debts') el.innerHTML = renderDebts();
  else if (currentPage === 'inventory') el.innerHTML = renderInventory();
  else if (currentPage === 'returns') el.innerHTML = renderReturns();
  else if (currentPage === 'suppliers') el.innerHTML = renderSuppliers();
  else if (currentPage === 'orders') el.innerHTML = renderOnlineOrders();
  attachGlobalHandlers();
}

// ===================== DASHBOARD =====================

  const totalProducts = STATE.products.length;

  const recent = [...STATE.invoices].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

  return `
    <div class="page-header">
      <div class="page-title">لوحة التحكم</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="top-row">
          <span class="stat-label">مبيعات اليوم</span>
          <div class="stat-icon icon-sage">💰</div>
        </div>
        <div class="stat-value">${money(todaySales)}</div>
      </div>
      <div class="stat-card">
        <div class="top-row">
          <span class="stat-label">فواتير اليوم</span>
          <div class="stat-icon icon-tan">🧾</div>
        </div>
        <div class="stat-value">${todayInvoices.length}</div>
      </div>
      <div class="stat-card">
        <div class="top-row">
          <span class="stat-label">إجمالي الأصناف</span>
          <div class="stat-icon icon-neutral">📦</div>
        </div>
        <div class="stat-value">${totalProducts}</div>
      </div>
      <div class="stat-card">
        <div class="top-row">
          <span class="stat-label">أصناف قاربت على النفاد</span>
          <div class="stat-icon icon-rust">⚠️</div>
        </div>
        <div class="stat-value">${lowStock}</div>
      </div>

    <div class="quick-actions">
      <h3>إجراءات سريعة</h3>
      <div class="qa-grid">
        <div class="qa-btn" onclick="goTo('pos')"><span class="qa-icon">🛍️</span>فاتورة جديدة</div>
        <div class="qa-btn" onclick="goTo('products')"><span class="qa-icon">➕</span>إضافة صنف</div>

function goTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
  render();
}

function emptyState(msg, icon) {
  return `<div class="empty-state"><div class="icon">${icon}</div><div>${msg}</div></div>`;
}

function renderDemandForecast() {
  const products = STATE.products;
  if (products.length === 0 || STATE.invoices.length === 0) return '';

  const thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

  const recentInvoices = STATE.invoices.filter(inv => new Date(inv.date) >= thirtyDaysAgo);
  if (recentInvoices.length === 0) return '';

  // احسب عدد الأيام الفعلية اللي فيها مبيعات مسجلة (أو 30 يوم كحد أقصى)
  const daysSinceFirstSale = Math.max(1, Math.min(30, Math.ceil((new Date() - new Date(STATE.invoices[0].date)) / (1000*60*60*24))));

  const salesVelocity = {}; // productName -> total qty sold in period
  recentInvoices.forEach(inv => {
    inv.items.forEach(it => {
      salesVelocity[it.name] = (salesVelocity[it.name] || 0) + it.qty;
    });
  });

  const forecasts = products.map(p => {
    const soldQty = salesVelocity[p.name] || 0;
    const dailyRate = soldQty / daysSinceFirstSale;
    const daysUntilOut = dailyRate > 0 ? Math.floor(p.qty / dailyRate) : null;
    const suggestedReorder = dailyRate > 0 ? Math.ceil(dailyRate * 14) : 0; // اقتراح تغطية أسبوعين
    return { ...p, dailyRate, daysUntilOut, suggestedReorder, soldQty };
  }).filter(f => f.soldQty > 0)
    .sort((a,b) => (a.daysUntilOut ?? 999) - (b.daysUntilOut ?? 999));

  const urgent = forecasts.filter(f => f.daysUntilOut !== null && f.daysUntilOut <= 14);
  if (urgent.length === 0) return '';

  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">📈 توقع الطلب — أصناف محتاجة تجديد قريب</div>
      <div class="hint" style="padding:12px 20px 0;">حساب تقريبي بناءً على معدل البيع في آخر ${daysSinceFirstSale} يوم. مش توقع مضمون، بس مؤشر مفيد للتجهيز المبكر.</div>
      <table>
        <thead><tr><th>الصنف</th><th>الكمية الحالية</th><th>معدل البيع/يوم</th><th>هينفد خلال</th><th>مقترح إعادة الطلب</th></tr></thead>
        <tbody>
          ${urgent.map(f => `
            <tr>
              <td><strong>${f.name}</strong></td>
              <td>${f.qty}</td>
              <td>${f.dailyRate.toFixed(2)}</td>
              <td><span class="badge ${f.daysUntilOut <= 5 ? 'badge-rust' : 'badge-gold'}">${f.daysUntilOut} يوم</span></td>
              <td><strong>${f.suggestedReorder}</strong> قطعة</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderProductsTable(rows) {
  if (rows.length === 0) return emptyState('لسه مفيش أصناف مضافة. ابدأ بإضافة أول صنف.', '👕');
  return `
  <table>
    <thead><tr><th>الاسم</th><th>الكود</th><th>التصنيف</th><th>المقاس</th><th>اللون</th><th>الباركود</th><th>الكمية</th><th>السعر</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
    <tbody>
      ${rows.map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td>${p.code || '-'}</td>
          <td>${p.category ? `<span class="badge badge-gold">${p.category}</span>` : '-'}</td>
          <td>${p.size || '-'}</td>
          <td>${p.color || '-'}</td>
          <td>${p.barcode || '-'}</td>
          <td>${p.qty}</td>
          <td>${money(p.price)}</td>
          <td>${p.qty === 0 ? '<span class="badge badge-rust">نافد</span>' : p.qty <= 3 ? '<span class="badge badge-gold">منخفض</span>' : '<span class="badge badge-sage">متوفر</span>'}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="openProductModal('${p.id}')">تعديل</button>
            <button class="btn btn-rust btn-sm" onclick="deleteProduct('${p.id}')">حذف</button>
          </td>
        </tr>
      `).join('')}
    </tbody>
  </table>`;
}

function filterByCategory(cat) {
  const filtered = cat ? STATE.products.filter(p => p.category === cat) : STATE.products;
  document.getElementById('productsTableWrap').innerHTML = renderProductsTable(filtered);
}

      <div class="field-label">الكمية بالمخزون</div>
      <input class="field-input" id="mp_qty" type="number" min="0" value="${p ? p.qty : ''}" placeholder="0">
    </div>
    <div class="field-group">
      <div class="field-label">المورد (اختياري)</div>
      <select class="field-input" id="mp_supplier">
        <option value="">بدون مورد</option>
        ${(STATE.suppliers || []).map(s => `<option value="${s.id}" ${p && p.supplierId === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
      </select>
    </div>
    <div class="field-group">
      <div class="field-label">الباركود (اختياري)</div>
      <input class="field-input" id="mp_barcode" value="${p ? (p.barcode || '') : ''}" placeholder="اتركه فاضي لو مفيش، أو امسحه بالسكانر">

    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveProduct(${p ? `'${p.id}'` : 'null'})">${p ? 'حفظ التعديل' : 'إضافة الصنف'}</button>
    </div>
  `;

function addNewCategoryPrompt() {
  const name = prompt('اكتب اسم التصنيف الجديد:');
  if (!name || !name.trim()) return;
  if (!STATE.categories) STATE.categories = [...DEFAULT_CATEGORIES];
  if (!STATE.categories.includes(name.trim())) {
    STATE.categories.push(name.trim());
    saveData(STATE);
  }
  const select = document.getElementById('mp_category');
  const opt = document.createElement('option');
  opt.value = name.trim();
  opt.textContent = name.trim();
  opt.selected = true;
  select.appendChild(opt);
}

async function saveProduct(id) {
  const name = document.getElementById('mp_name').value.trim();
  const category = document.getElementById('mp_category').value;
  const size = document.getElementById('mp_size').value.trim();
  const color = document.getElementById('mp_color').value.trim();
  const code = document.getElementById('mp_code').value.trim();
  const price = parseFloat(document.getElementById('mp_price').value);
  const cost = parseFloat(document.getElementById('mp_cost').value);
  const qty = parseInt(document.getElementById('mp_qty').value);
  const supplierId = document.getElementById('mp_supplier').value;
  const barcode = document.getElementById('mp_barcode').value.trim();

  if (!name) { showToast('من فضلك اكتب اسم الصنف'); return; }
  if (isNaN(price) || price < 0) { showToast('اكتب سعر صحيح'); return; }
  if (isNaN(qty) || qty < 0) { showToast('اكتب كمية صحيحة'); return; }

  if (id) {
    const p = STATE.products.find(x => x.id === id);
    p.name = name; p.price = price; p.qty = qty; p.barcode = barcode;
    p.category = category; p.size = size; p.cost = isNaN(cost) ? 0 : cost;
    p.color = color; p.code = code; p.supplierId = supplierId;
    showToast('تم تعديل الصنف');
  } else {
    STATE.products.push({ id: uid(), name, price, qty, barcode, category, size, cost: isNaN(cost) ? 0 : cost, color, code, supplierId });
    showToast('تم إضافة الصنف');
  }
  await saveData(STATE);
  closeModal();
  render();
}

async function deleteProduct(id) {
  if (!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
  STATE.products = STATE.products.filter(p => p.id !== id);
  await saveData(STATE);
  showToast('تم حذف الصنف');
  render();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

// ===================== POS =====================

  const remaining = saleType === 'آجل' ? Math.max(0, total - paidNowVal) : 0;

    <div class="page-header">
      <div class="page-title">نقطة البيع</div>
    </div>
    <div class="pos-layout">
      <div class="pos-summary">
        <div class="total-box">
          <div class="label">الإجمالي المطلوب</div>
          <div class="amount">${money(total)}</div>
        </div>
        <div class="summary-row"><span class="lbl">عدد الأصناف</span><span class="val">${cart.length}</span></div>
        <div class="summary-row"><span class="lbl">الإجمالي قبل الخصم</span><span class="val">${money(subtotal)}</span></div>

        <div class="field-group">
          <div class="field-label">نسبة الخصم %</div>
          <input class="field-input" id="discountInput" type="number" min="0" max="100" value="${discountPercent}" oninput="updateDiscount(this.value)">

        <div class="summary-row"><span class="lbl">قيمة الخصم</span><span class="val">${money(discountVal)}</span></div>

        ${saleType === 'آجل' ? `
        <div class="summary-row"><span class="lbl">هيتبقى على العميل</span><span class="val"><strong style="color:var(--rust)">${money(remaining)}</strong></span></div>

            <div class="pay-method ${saleType === 'آجل' ? 'active' : ''}" onclick="setSaleType('آجل')">آجل (دين)</div>

            <div class="pay-method ${paymentMethod === 'فيزا' ? 'active' : ''}" onclick="setPayment('فيزا')">فيزا</div>

function renderProductTiles(products) {

      <div class="p-name">${p.name}</div>
      <div class="p-price">${money(p.price)}</div>
      <div class="p-stock">متوفر: ${p.qty}</div>
    </div>
  `).join('');
}

function attachPOSHandlers() {
  discountPercent = discountPercent || 0;
}

function handleScannerEnter(event) {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const value = event.target.value.trim();
  if (!value) return;

  // نبحث عن تطابق تام في الباركود الأول (السكانر بيبعت الرقم كامل)
  const exactMatch = STATE.products.find(p => p.barcode && p.barcode === value);
  if (exactMatch) {
    addToCart(exactMatch.id);
    event.target.value = '';
    filterProducts('');
    showToast('تم إضافة: ' + exactMatch.name);
    return;
  }

  // لو مفيش تطابق تام، جرب البحث بالاسم أو جزء من الباركود
  const partialMatches = STATE.products.filter(p =>
    p.name.toLowerCase().includes(value.toLowerCase()) || (p.barcode && p.barcode.includes(value))
  );
  if (partialMatches.length === 1) {
    addToCart(partialMatches[0].id);
    event.target.value = '';
    filterProducts('');
    showToast('تم إضافة: ' + partialMatches[0].name);
  } else if (partialMatches.length === 0) {
    showToast('مفيش منتج بالباركود أو الاسم ده');
  }
  // لو فيه أكتر من نتيجة، سيبها ظاهرة في الشبكة يختار منها يدوي
}

function filterByCategoryInPOS(cat) {
  const filtered = STATE.products.filter(p => p.category === cat);
  document.getElementById('productGrid').innerHTML = renderProductTiles(filtered);
  if (document.getElementById('posSearch')) document.getElementById('posSearch').value = '';
}

function filterProducts(query) {
  const q = query.trim().toLowerCase();
  const filtered = STATE.products.filter(p =>
    p.name.toLowerCase().includes(q) || (p.barcode && p.barcode.includes(q))
  );
  document.getElementById('productGrid').innerHTML = renderProductTiles(filtered);
}

function addToCart(productId) {
  const p = STATE.products.find(x => x.id === productId);
  if (!p) return;
  if (p.qty <= 0) { showToast('الصنف ده نافد من المخزون'); return; }

  const existing = cart.find(c => c.productId === productId);
  if (existing) {
    if (existing.qty + 1 > p.qty) { showToast('الكمية المطلوبة أكبر من المتوفر بالمخزون'); return; }
    existing.qty += 1;
  } else {
    cart.push({ productId, name: p.name, price: p.price, qty: 1 });
  }
  refreshPOSPanels();
}

function changeQty(productId, delta) {
  const item = cart.find(c => c.productId === productId);
  const p = STATE.products.find(x => x.id === productId);
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty <= 0) {
    cart = cart.filter(c => c.productId !== productId);
  } else if (p && newQty > p.qty) {
    showToast('الكمية المطلوبة أكبر من المتوفر بالمخزون');
    return;
  } else {
    item.qty = newQty;
  }
  refreshPOSPanels();
}

function removeFromCart(productId) {
  cart = cart.filter(c => c.productId !== productId);
  refreshPOSPanels();
}

function clearCart() {
  cart = [];
  discountPercent = 0;
  refreshPOSPanels();
}

function updateDiscount(val) {
  discountPercent = parseFloat(val) || 0;
  refreshPOSPanels(true);
}

function setSaleType(type) {
  saleType = type;
  refreshPOSPanels();
}

function setPayment(method) {
  paymentMethod = method;
  refreshPOSPanels();
}

function refreshPOSPanels(keepFocus) {
  const searchVal = document.getElementById('posSearch') ? document.getElementById('posSearch').value : '';
  const customerVal = document.getElementById('customerName') ? document.getElementById('customerName').value : '';
  const phoneVal = document.getElementById('customerPhone') ? document.getElementById('customerPhone').value : '';
  document.getElementById('pageContent').innerHTML = renderPOS();
  if (searchVal) {
    document.getElementById('posSearch').value = searchVal;
    filterProducts(searchVal);
  }
  if (customerVal && document.getElementById('customerName')) document.getElementById('customerName').value = customerVal;
  if (phoneVal && document.getElementById('customerPhone')) document.getElementById('customerPhone').value = phoneVal;
}

async function checkout() {
  if (cart.length === 0) return;
  const customer = document.getElementById('customerName').value.trim();
  const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const discountVal = subtotal * (discountPercent / 100);
  const total = subtotal - discountVal;

  let paidNow = total;
  let customerPhone = '';

  if (saleType === 'آجل') {
    if (!customer) { showToast('اسم العميل مطلوب في البيع الآجل'); return; }
    customerPhone = document.getElementById('customerPhone').value.trim();
    if (!customerPhone) { showToast('رقم تليفون العميل مطلوب في البيع الآجل'); return; }
    const paidInput = document.getElementById('paidNowInput').value;
    paidNow = parseFloat(paidInput) || 0;
    if (paidNow < 0 || paidNow > total) { showToast('المبلغ المدفوع غير صحيح'); return; }
  }

  // deduct stock
  for (const item of cart) {
    const p = STATE.products.find(x => x.id === item.productId);
    if (p) p.qty = Math.max(0, p.qty - item.qty);
  }

  const invoice = {
    id: uid(),
    number: 'INV-' + Math.floor(10000 + Math.random() * 89999),
    date: new Date().toISOString(),
    customer: customer || 'عميل عادي',
    items: cart.map(c => ({ name: c.name, price: c.price, qty: c.qty })),
    subtotal, discountPercent, discountVal, total,
    payment: paymentMethod,
    saleType, paidNow, remaining: total - paidNow
  };
  STATE.invoices.push(invoice);

  if (saleType === 'آجل' && (total - paidNow) > 0) {
    STATE.debts.push({
      id: uid(),
      invoiceId: invoice.id,
      invoiceNumber: invoice.number,
      customer,
      phone: customerPhone,
      total,
      paid: paidNow,
      remaining: total - paidNow,
      date: new Date().toISOString(),
      status: 'مفتوح',
      payments: paidNow > 0 ? [{ amount: paidNow, date: new Date().toISOString() }] : []
    });
  }

  await saveData(STATE);

  cart = [];
  discountPercent = 0;
  saleType = 'عادي';
  lastPaidNow = '';
  showToast('تم حفظ الفاتورة رقم ' + invoice.number);
  render();

  setTimeout(() => {
    if (confirm('تم حفظ الفاتورة رقم ' + invoice.number + '. عايز تطبعها دلوقتي؟')) {
      printInvoice(invoice.id);
    }
  }, 300);
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `نسخة-احتياطية-ابو-زياد-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('تم تحميل النسخة الاحتياطية');
}

function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.products || !data.invoices || !data.expenses) {
        showToast('الملف مش بصيغة صحيحة');
        return;
      }
      if (!confirm('هيتم استبدال كل البيانات الحالية بالنسخة دي. متأكد؟')) return;
      STATE = data;
      await saveData(STATE);
      showToast('تم استيراد النسخة الاحتياطية بنجاح');
      render();
    } catch (err) {
      showToast('حصل خطأ في قراءة الملف');
    }
  };
  reader.readAsText(file);
}

                ${d.remaining > 0 ? `<button class="btn btn-sage btn-sm" onclick="openPayDebtModal('${d.id}')">تسجيل دفعة</button>` : ''}
              </td>
            </tr>
          `).join('')}

      </table>`}

}

function openPayDebtModal(debtId) {
  const d = STATE.debts.find(x => x.id === debtId);
  if (!d) return;
  document.getElementById('modalBox').innerHTML = `
    <h3>تسجيل دفعة - ${d.customer}</h3>
    <div class="summary-row"><span class="lbl">إجمالي الفاتورة</span><span class="val">${money(d.total)}</span></div>
    <div class="summary-row"><span class="lbl">المدفوع حتى الآن</span><span class="val">${money(d.paid)}</span></div>
    <div class="summary-row"><span class="lbl">المتبقي</span><span class="val"><strong style="color:var(--rust)">${money(d.remaining)}</strong></span></div>
    <div class="field-group">
      <div class="field-label">المبلغ المدفوع الآن</div>
      <input class="field-input" id="payAmount" type="number" min="0" max="${d.remaining}" step="0.01" placeholder="0.00">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-sage" onclick="payDebt('${d.id}')">تسجيل الدفعة</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

async function payDebt(debtId) {
  const amount = parseFloat(document.getElementById('payAmount').value);
  const d = STATE.debts.find(x => x.id === debtId);
  if (!d) return;
  if (isNaN(amount) || amount <= 0) { showToast('اكتب مبلغ صحيح'); return; }
  if (amount > d.remaining) { showToast('المبلغ أكبر من المتبقي'); return; }

  d.paid += amount;
  d.remaining -= amount;
  d.payments.push({ amount, date: new Date().toISOString() });

  await saveData(STATE);
  showToast('تم تسجيل الدفعة');
  closeModal();
  render();
}

// ===================== PROFITS =====================
function renderProfits() {
  const totalSales = STATE.invoices.reduce((s,i) => s + i.total, 0);
  const totalExpenses = STATE.expenses.reduce((s,e) => s + e.amount, 0);
  const totalPurchases = (STATE.purchaseInvoices || []).reduce((s,p) => s + p.total, 0);

  // cost of goods sold — based on cost price recorded per product at sale time (falls back to 0 if not set)
  let totalCOGS = 0;
  STATE.invoices.forEach(inv => {
    inv.items.forEach(it => {
      const product = STATE.products.find(p => p.name === it.name);
      const cost = product ? (product.cost || 0) : 0;
      totalCOGS += cost * it.qty;
    });
  });

  const grossProfit = totalSales - totalCOGS;
  const netProfit = grossProfit - totalExpenses;
  const profitMargin = totalSales > 0 ? (netProfit / totalSales) * 100 : 0;
  const grossMargin = totalSales > 0 ? (grossProfit / totalSales) * 100 : 0;

  const today = new Date().toDateString();
  const todaySales = STATE.invoices.filter(i => new Date(i.date).toDateString() === today).reduce((s,i)=>s+i.total,0);
  const todayExpenses = STATE.expenses.filter(e => new Date(e.date).toDateString() === today).reduce((s,e)=>s+e.amount,0);

  // تدفق نقدي: كاش داخل فعليًا (المدفوع فقط من الفواتير، مش الآجل الكامل) ناقص كاش خارج (مصروفات + مشتريات نقدية)
  const actualCashIn = STATE.invoices.reduce((s,i) => s + (i.saleType === 'آجل' ? i.paidNow : i.total), 0);
  const cashOut = totalExpenses + totalPurchases;
  const netCashFlow = actualCashIn - cashOut;
  const openDebtsTotal = (STATE.debts || []).reduce((s,d) => s + d.remaining, 0);

  // تحليل شهري لآخر 6 شهور
  const monthlyData = {};
  STATE.invoices.forEach(inv => {
    const d = new Date(inv.date);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    if (!monthlyData[key]) monthlyData[key] = { sales: 0, label: d.toLocaleDateString('ar-EG', {month:'long', year:'numeric'}) };
    monthlyData[key].sales += inv.total;
  });
  STATE.expenses.forEach(e => {
    const d = new Date(e.date);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    if (!monthlyData[key]) monthlyData[key] = { sales: 0, label: d.toLocaleDateString('ar-EG', {month:'long', year:'numeric'}), expenses: 0 };
    if (!monthlyData[key].expenses) monthlyData[key].expenses = 0;
    monthlyData[key].expenses += e.amount;
  });
  const monthKeys = Object.keys(monthlyData).sort().reverse().slice(0, 6);

  const hasCostData = STATE.products.some(p => p.cost > 0);

  return `
    <div class="page-header">
      <div class="page-title">الأرباح</div>
    </div>

    ${!hasCostData ? `
    <div class="card" style="padding:16px 20px; margin-bottom:18px; background:var(--gold-soft); border-color:var(--gold);">
      <strong>ملحوظة:</strong> حساب الربح الفعلي بيحتاج سعر التكلفة لكل صنف. دلوقتي مفيش أسعار تكلفة متسجلة، فالأرباح المعروضة دي هي المبيعات ناقص المصروفات بس (من غير خصم تكلفة البضاعة). روح "الأصناف" وسجل سعر التكلفة لكل منتج عشان تبقى الأرقام دقيقة.
    </div>
    ` : ''}

    <div class="stats-grid">
      <div class="stat-card">
        <div class="top-row"><span class="stat-label">إجمالي المبيعات</span><div class="stat-icon icon-sage">💰</div></div>
        <div class="stat-value">${money(totalSales)}</div>
      </div>
      <div class="stat-card">
        <div class="top-row"><span class="stat-label">صافي الربح</span><div class="stat-icon icon-tan">📈</div></div>
        <div class="stat-value" style="color:${netProfit >= 0 ? 'var(--sage)' : 'var(--rust)'}">${money(netProfit)}</div>
      </div>
      <div class="stat-card">
        <div class="top-row"><span class="stat-label">هامش الربح الصافي</span><div class="stat-icon icon-neutral">📊</div></div>
        <div class="stat-value" style="color:${profitMargin >= 0 ? 'var(--sage)' : 'var(--rust)'}">${profitMargin.toFixed(1)}%</div>
      </div>
      <div class="stat-card">
        <div class="top-row"><span class="stat-label">صافي التدفق النقدي</span><div class="stat-icon icon-rust">💵</div></div>
        <div class="stat-value" style="color:${netCashFlow >= 0 ? 'var(--sage)' : 'var(--rust)'}">${money(netCashFlow)}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-header">ملخص اليوم</div>
      <div style="padding:16px 20px;">
        <div class="summary-row"><span class="lbl">مبيعات اليوم</span><span class="val">${money(todaySales)}</span></div>
        <div class="summary-row"><span class="lbl">مصروفات اليوم</span><span class="val">${money(todayExpenses)}</span></div>
        <div class="summary-row"><span class="lbl"><strong>صافي اليوم</strong></span><span class="val"><strong>${money(todaySales - todayExpenses)}</strong></span></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-header">تفصيل الربح الإجمالي</div>
      <div style="padding:16px 20px;">
        <div class="summary-row"><span class="lbl">إجمالي المبيعات</span><span class="val">${money(totalSales)}</span></div>
        <div class="summary-row"><span class="lbl">− تكلفة البضاعة</span><span class="val">${money(totalCOGS)}</span></div>
        <div class="summary-row"><span class="lbl"><strong>= مجمل الربح</strong></span><span class="val"><strong>${money(grossProfit)}</strong></span></div>
        <div class="summary-row"><span class="lbl">هامش الربح الإجمالي</span><span class="val">${grossMargin.toFixed(1)}%</span></div>
        <div class="summary-row"><span class="lbl">− المصروفات</span><span class="val">${money(totalExpenses)}</span></div>
        <div class="summary-row"><span class="lbl"><strong>= صافي الربح</strong></span><span class="val"><strong style="color:${netProfit >= 0 ? 'var(--sage)' : 'var(--rust)'}">${money(netProfit)}</strong></span></div>
        <div class="summary-row"><span class="lbl"><strong>هامش الربح الصافي</strong></span><span class="val"><strong>${profitMargin.toFixed(1)}%</strong></span></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-header">التدفق النقدي (كاش فعلي)</div>
      <div style="padding:16px 20px;">
        <div class="hint" style="margin-bottom:10px;">التدفق النقدي بيحسب الكاش اللي دخل فعليًا (مش شامل المتبقي من فواتير الآجل)</div>
        <div class="summary-row"><span class="lbl">كاش داخل (مدفوعات فعلية)</span><span class="val" style="color:var(--sage)">+ ${money(actualCashIn)}</span></div>
        <div class="summary-row"><span class="lbl">− مصروفات</span><span class="val" style="color:var(--rust)">- ${money(totalExpenses)}</span></div>
        <div class="summary-row"><span class="lbl">− مشتريات من الموردين</span><span class="val" style="color:var(--rust)">- ${money(totalPurchases)}</span></div>
        <div class="summary-row"><span class="lbl"><strong>= صافي التدفق النقدي</strong></span><span class="val"><strong style="color:${netCashFlow >= 0 ? 'var(--sage)' : 'var(--rust)'}">${money(netCashFlow)}</strong></span></div>
        ${openDebtsTotal > 0 ? `
        <div class="summary-row" style="margin-top:10px; border-top:1px dashed var(--border); padding-top:10px;">
          <span class="lbl">⚠ متبقي على عملاء (آجل لسه ما اتحصلش)</span>
          <span class="val" style="color:var(--gold)"><strong>${money(openDebtsTotal)}</strong></span>
        </div>` : ''}
      </div>
    </div>

    ${monthKeys.length > 0 ? `
    <div class="card">
      <div class="card-header">أداء آخر الشهور</div>
      <table>
        <thead><tr><th>الشهر</th><th>المبيعات</th><th>المصروفات</th><th>صافي تقريبي</th></tr></thead>
        <tbody>
          ${monthKeys.map(k => {
            const m = monthlyData[k];
            const exp = m.expenses || 0;
            return `<tr>
              <td><strong>${m.label}</strong></td>
              <td>${money(m.sales)}</td>
              <td>${money(exp)}</td>
              <td style="color:${(m.sales - exp) >= 0 ? 'var(--sage)' : 'var(--rust)'}">${money(m.sales - exp)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    ` : ''}
  `;
}

function openInventoryCountModal() {
  const rows = STATE.products;
  if (rows.length === 0) { showToast('مفيش أصناف تتجرد'); return; }
  document.getElementById('modalBox').innerHTML = `
    <h3>جرد فعلي للمخزون</h3>
    <div class="hint" style="margin-bottom:14px;">اكتب الكمية اللي عديتها فعليًا في المحل لكل صنف، والنظام هيوريك الفرق.</div>
    <div style="max-height: 340px; overflow-y:auto;">
      ${rows.map(p => `
        <div class="field-group">
          <div class="field-label">${p.name} ${p.size ? '(' + p.size + ')' : ''} — مسجل بالنظام: ${p.qty}</div>
          <input class="field-input count-input" data-id="${p.id}" data-system="${p.qty}" type="number" min="0" placeholder="اكتب العدد الفعلي">
        </div>
      `).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="runInventoryCount()">عرض النتيجة</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function runInventoryCount() {
  const inputs = document.querySelectorAll('.count-input');
  const results = [];
  inputs.forEach(inp => {
    const val = inp.value.trim();
    if (val === '') return;
    const actual = parseInt(val);
    const system = parseInt(inp.dataset.system);
    const product = STATE.products.find(p => p.id === inp.dataset.id);
    if (!isNaN(actual) && product) {
      results.push({ id: product.id, name: product.name, system, actual, diff: actual - system });
    }
  });

  if (results.length === 0) { showToast('محتاج تكتب كميات فعلية على الأقل لصنف واحد'); return; }

  window._lastCountResults = results;
  closeModal();

  const diffs = results.filter(r => r.diff !== 0);
  document.getElementById('countResultWrap').innerHTML = `
    <div class="card" style="margin-top:18px;">
      <div class="card-header">نتيجة الجرد ${diffs.length === 0 ? '(كل حاجة مطابقة)' : ''}</div>
      <table>
        <thead><tr><th>الصنف</th><th>مسجل بالنظام</th><th>العدد الفعلي</th><th>الفرق</th></tr></thead>
        <tbody>
          ${results.map(r => `
            <tr>
              <td><strong>${r.name}</strong></td>
              <td>${r.system}</td>
              <td>${r.actual}</td>
              <td>${r.diff === 0 ? '<span class="badge badge-sage">مطابق</span>' : r.diff > 0 ? `<span class="badge badge-gold">+${r.diff} زيادة</span>` : `<span class="badge badge-rust">${r.diff} نقص</span>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${diffs.length > 0 ? `
      <div style="padding:16px 20px;">
        <button class="btn btn-primary" onclick="applyInventoryCount()">تحديث الكميات في النظام بالعدد الفعلي</button>
      </div>` : ''}
    </div>
  `;
}

async function applyInventoryCount() {
  if (!window._lastCountResults) return;
  if (!confirm('هيتم تعديل كميات المخزون في النظام لتطابق العدد الفعلي. متأكد؟')) return;
  window._lastCountResults.forEach(r => {
    const p = STATE.products.find(x => x.id === r.id);
    if (p) p.qty = r.actual;
  });
  await saveData(STATE);
  showToast('تم تحديث المخزون حسب الجرد الفعلي');
  window._lastCountResults = null;
  render();
}

function setReturnType(type) {
  document.getElementById('typeReturn').classList.toggle('active', type === 'مرتجع');
  document.getElementById('typeExchange').classList.toggle('active', type === 'استبدال');
  document.getElementById('exchangeFields').style.display = type === 'استبدال' ? 'block' : 'none';
  window._returnType = type;
}
window._returnType = 'مرتجع';

async function saveReturn() {
  const type = window._returnType || 'مرتجع';
  const invoiceNumber = document.getElementById('ret_invoice').value.trim();
  const customer = document.getElementById('ret_customer').value.trim();
  const itemId = document.getElementById('ret_item').value;
  const qty = parseInt(document.getElementById('ret_qty').value);
  const reason = document.getElementById('ret_reason').value.trim();

  if (!itemId) { showToast('اختار الصنف المرتجع'); return; }
  if (isNaN(qty) || qty <= 0) { showToast('اكتب كمية صحيحة'); return; }

  const returnedProduct = STATE.products.find(p => p.id === itemId);
  if (!returnedProduct) { showToast('الصنف مش موجود'); return; }

  let exchangeItem = null, exchangeQty = 0, exchangeProduct = null;
  if (type === 'استبدال') {
    const exchangeId = document.getElementById('ret_exchange_item').value;
    exchangeQty = parseInt(document.getElementById('ret_exchange_qty').value);
    if (!exchangeId) { showToast('اختار الصنف البديل'); return; }
    if (isNaN(exchangeQty) || exchangeQty <= 0) { showToast('اكتب كمية بديلة صحيحة'); return; }
    exchangeProduct = STATE.products.find(p => p.id === exchangeId);
    if (!exchangeProduct) { showToast('الصنف البديل مش موجود'); return; }
    if (exchangeProduct.qty < exchangeQty) { showToast('الكمية المطلوبة من الصنف البديل مش متوفرة بالمخزون'); return; }
    exchangeItem = exchangeProduct.name;
  }

  // stock adjustments: returned item goes back to stock, exchanged item goes out
  returnedProduct.qty += qty;
  if (exchangeProduct) exchangeProduct.qty -= exchangeQty;

  const refundAmount = type === 'مرتجع'
    ? returnedProduct.price * qty
    : (returnedProduct.price * qty) - (exchangeProduct.price * exchangeQty);

  STATE.returns.push({
    id: uid(),
    invoiceNumber, customer,
    type,
    returnedItem: returnedProduct.name, returnedQty: qty,
    exchangeItem, exchangeQty,
    refundAmount,
    reason,
    date: new Date().toISOString()
  });

  await saveData(STATE);
  showToast(type === 'مرتجع' ? 'تم تسجيل المرتجع وتحديث المخزون' : 'تم تسجيل الاستبدال وتحديث المخزون');
  closeModal();
  render();
}

// ===================== AUTH (تسجيل الدخول) =====================
const DEFAULT_PASSWORD = 'aboziyad2026';
const SESSION_KEY = 'abuZiyadLoggedIn';

async function simpleHash(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function getStoredPasswordHash() {
  try {
    const db = await openDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get('shop-password-hash');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function setStoredPasswordHash(hash) {
  const db = await openDB();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(hash, 'shop-password-hash');
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function attemptLogin() {
  const input = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  if (!input) { errEl.textContent = 'اكتب كلمة المرور'; return; }

  let storedHash = await getStoredPasswordHash();
  if (!storedHash) {
    // أول مرة يفتح الموقع: نخزن الباسورد الافتراضي كهاش
    storedHash = await simpleHash(DEFAULT_PASSWORD);
    await setStoredPasswordHash(storedHash);
  }

  const inputHash = await simpleHash(input);
  if (inputHash === storedHash) {
    sessionStorage.setItem(SESSION_KEY, '1');
    errEl.textContent = '';
    showApp();
  } else {
    errEl.textContent = 'كلمة المرور غير صحيحة';
  }
}

function logout() {
  if (!confirm('هل تريد تسجيل الخروج؟')) return;
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
}

async function changePassword() {
  const current = document.getElementById('cp_current').value;
  const newPass = document.getElementById('cp_new').value;
  const confirm2 = document.getElementById('cp_confirm').value;
  const errEl = document.getElementById('cp_error');

  const storedHash = await getStoredPasswordHash();
  const currentHash = await simpleHash(current);
  if (currentHash !== storedHash) { errEl.textContent = 'كلمة المرور الحالية غير صحيحة'; return; }
  if (!newPass || newPass.length < 4) { errEl.textContent = 'كلمة المرور الجديدة قصيرة جدًا (4 أحرف على الأقل)'; return; }
  if (newPass !== confirm2) { errEl.textContent = 'كلمة المرور الجديدة غير متطابقة'; return; }

  const newHash = await simpleHash(newPass);
  await setStoredPasswordHash(newHash);
  showToast('تم تغيير كلمة المرور بنجاح');
  closeModal();
}

function renderPurchaseItemsList() {
  if (purchaseCart.length === 0) return `<div class="hint">لسه مفيش أصناف مضافة للفاتورة</div>`;
  return purchaseCart.map((item, idx) => `
    <div class="summary-row">
      <span class="lbl">${item.name} × ${item.qty}</span>
      <span class="val">${money(item.price * item.qty)} <span style="color:var(--rust); cursor:pointer; margin-right:8px;" onclick="removePurchaseItem(${idx})">✕</span></span>
    </div>
  `).join('');
}

function addPurchaseItem(supplierId) {
  const name = document.getElementById('pi_itemName').value.trim();
  const qty = parseInt(document.getElementById('pi_qty').value);
  const price = parseFloat(document.getElementById('pi_price').value);
  if (!name) { showToast('اكتب اسم الصنف'); return; }
  if (isNaN(qty) || qty <= 0) { showToast('اكتب كمية صحيحة'); return; }
  if (isNaN(price) || price < 0) { showToast('اكتب سعر صحيح'); return; }

  purchaseCart.push({ name, qty, price });
  const supplier = STATE.suppliers.find(s => s.id === supplierId);
  renderPurchaseInvoiceModal(supplier);
}

function removePurchaseItem(idx) {
  purchaseCart.splice(idx, 1);
  const supplier = STATE.suppliers.find(s => s.id === currentPurchaseSupplierId);
  if (supplier) renderPurchaseInvoiceModal(supplier);
}

async function savePurchaseInvoice(supplierId) {
  if (purchaseCart.length === 0) return;
  const supplier = STATE.suppliers.find(s => s.id === supplierId);
  const total = purchaseCart.reduce((s,i) => s + i.price * i.qty, 0);

  const purchaseInvoice = {
    id: uid(),
    number: 'PUR-' + Math.floor(10000 + Math.random() * 89999),
    supplierId, supplierName: supplier.name,
    items: [...purchaseCart],
    total,
    date: new Date().toISOString()
  };

  if (!STATE.purchaseInvoices) STATE.purchaseInvoices = [];
  STATE.purchaseInvoices.push(purchaseInvoice);
  await saveData(STATE);

  purchaseCart = [];
  showToast('تم حفظ فاتورة الشراء');
  closeModal();
  render();

  setTimeout(() => {
    if (confirm('عايز تطبع فاتورة الشراء دلوقتي؟')) {
      printPurchaseInvoice(purchaseInvoice.id);
    }
  }, 300);
}

      <input class="field-input" id="ord_address" placeholder="المحافظة، المنطقة، تفاصيل العنوان">
    </div>
    <div class="field-group">
      <div class="field-label">وصف الأصناف المطلوبة</div>
      <input class="field-input" id="ord_items" placeholder="مثال: عباية سوداء مقاس L × 1">
    </div>
    <div class="field-group">
      <div class="field-label">الإجمالي (ج.م)</div>
      <input class="field-input" id="ord_total" type="number" min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveOrder()">حفظ الأوردر</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

async function saveOrder() {
  const customer = document.getElementById('ord_customer').value.trim();
  const phone = document.getElementById('ord_phone').value.trim();
  const address = document.getElementById('ord_address').value.trim();
  const itemsText = document.getElementById('ord_items').value.trim();
  const total = parseFloat(document.getElementById('ord_total').value);

  if (!customer) { showToast('اكتب اسم العميل'); return; }
  if (!phone) { showToast('اكتب رقم التليفون'); return; }
  if (!itemsText) { showToast('اكتب وصف الأصناف المطلوبة'); return; }
  if (isNaN(total) || total < 0) { showToast('اكتب إجمالي صحيح'); return; }

  if (!STATE.onlineOrders) STATE.onlineOrders = [];
  STATE.onlineOrders.push({
    id: uid(), customer, phone, address, itemsText, total,
    status: 'قيد التجهيز',
    date: new Date().toISOString()
  });

  await saveData(STATE);
  showToast('تم إضافة الأوردر');
  closeModal();
  render();
}

async function updateOrderStatus(id, status) {
  const order = STATE.onlineOrders.find(o => o.id === id);
  if (!order) return;
  order.status = status;
  await saveData(STATE);
  showToast('تم تحديث حالة الأوردر إلى: ' + status);
}

// ===================== INIT =====================
async function init() {
  setDate();

  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    showApp();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appWrap').style.display = 'none';
  }

  document.getElementById('pageContent').innerHTML = `<div class="page"><div class="empty-state"><span class="loading-dot"></span> جاري تحميل البيانات...</div></div>`;
  STATE = await loadData();
  render();
}

init();

// ===================== PWA: SERVICE WORKER REGISTRATION =====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => {
      console.log('Service worker registered — الموقع هيشتغل من غير نت بعد أول تحميل');
    }).catch((err) => {
      console.log('Service worker registration failed:', err);
    });
  });
}
</script>
